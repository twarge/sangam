name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The xcode-27 image defaults to Xcode 27.0. Build with 27.1, the Xcode the
# app is developed on, so CI compiles against the same SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  # The conference core is a Swift package; its tests exercise real WebRTC,
  # so they need a Mac (the staged xcframework rides in via SPM).
  test:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package tests
        # Under a PTY: swift test block-buffers its per-test lines when piped,
        # so a hang looks like no output at all. The PTY flushes each line and
        # the log then shows exactly which test a runner is stuck in.
        run: script -q /dev/null make test-ci

  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project apps/Sangam.xcodeproj \
            -scheme Sangam \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
