name: Sangam
options:
  bundleIdPrefix: com.twarge
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "27.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 257KW9ZJFP
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: 0.1.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.4

packages:
  JitsiNativeCore:
    path: ../packages/JitsiNativeCore
  JitsiMeetSDK:
    url: https://github.com/jitsi/jitsi-meet-ios-sdk-releases.git
    exactVersion: 13.1.1

targets:
  Sangam-macOS:
    type: application
    platform: macOS
    productName: Sangam
    sources:
      - path: Sangam/Sources
      - path: Sangam/Assets.xcassets
    dependencies:
      - package: JitsiNativeCore
        product: JitsiNativeCore
      - package: JitsiNativeCore
        product: JitsiMedia
      - package: JitsiNativeCore
        product: JitsiConference
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sangam/SangamMac.entitlements
        INFOPLIST_FILE: Sangam/Info-macOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam
        PRODUCT_NAME: Sangam
    scheme:
      gatherCoverageData: false

  Sangam-iOS:
    type: application
    platform: iOS
    productName: Sangam
    sources:
      - path: Sangam/Sources
      - path: Sangam/Assets.xcassets
    dependencies:
      - package: JitsiNativeCore
        product: JitsiNativeCore
      - package: JitsiNativeCore
        product: JitsiMedia
      - package: JitsiNativeCore
        product: JitsiConference
      - package: JitsiMeetSDK
      - target: SangamBroadcastExtension
        embed: true
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        CODE_SIGN_ENTITLEMENTS: Sangam/SangamIOS.entitlements
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sangam/Info-iOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam
        PRODUCT_NAME: Sangam
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false

  SangamBroadcastExtension:
    type: app-extension
    platform: iOS
    productName: SangamBroadcastExtension
    sources:
      - path: SangamBroadcastExtension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SangamBroadcastExtension/SangamBroadcastExtension.entitlements
        INFOPLIST_FILE: SangamBroadcastExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam.broadcast
        PRODUCT_NAME: SangamBroadcastExtension
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
