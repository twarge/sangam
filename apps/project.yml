name: Sangam
options:
  bundleIdPrefix: com.twarge
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "27.0"

settings:
  base:
    # Apple Silicon only, everywhere — including the Mac and the simulator.
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 257KW9ZJFP
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: 0.1.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6 is the newest language MODE (modes are 4/4.2/5/6); the
    # toolchain itself is whatever Xcode provides. Higher values here read
    # as future modes and break older toolchains like CI's.
    SWIFT_VERSION: "6"

packages:
  JitsiNativeCore:
    path: ../packages/JitsiNativeCore

targets:
  Sangam:
    type: application
    supportedDestinations: [macOS, iOS]
    productName: Sangam
    sources:
      - path: Sangam/Sources
      - path: SangamShared
      - path: Sangam/Assets.xcassets
    dependencies:
      - package: JitsiNativeCore
        product: JitsiNativeCore
      - package: JitsiNativeCore
        product: JitsiMedia
      - package: JitsiNativeCore
        product: JitsiConference
      - package: JitsiNativeCore
        product: JitsiMeetingNotes
      - target: SangamBroadcastExtension
        embed: true
        destinationFilters: [iOS]
      - target: SangamWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam
        PRODUCT_NAME: Sangam
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sangam/SangamMac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Sangam/SangamIOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sangam/SangamIOS.entitlements
        "INFOPLIST_FILE[sdk=macosx*]": Sangam/Info-macOS.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": Sangam/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Sangam/Info-iOS.plist
        # XcodeGen gives a multi-destination app the iOS runpath only, so a Mac
        # build looks for embedded frameworks beside the executable instead of
        # in Contents/Frameworks and dyld fails to load WebRTC at launch.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    scheme:
      gatherCoverageData: false

  SangamWidgets:
    type: app-extension
    platform: iOS
    productName: SangamWidgets
    sources:
      - path: SangamWidgets
      - path: SangamShared
    settings:
      base:
        INFOPLIST_FILE: SangamWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam.widgets
        PRODUCT_NAME: SangamWidgets
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    scheme:
      gatherCoverageData: false

  SangamBroadcastExtension:
    type: app-extension
    platform: iOS
    productName: SangamBroadcastExtension
    sources:
      - path: SangamBroadcastExtension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SangamBroadcastExtension/SangamBroadcastExtension.entitlements
        INFOPLIST_FILE: SangamBroadcastExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam.broadcast
        PRODUCT_NAME: SangamBroadcastExtension
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
