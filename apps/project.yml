name: Sangam
options:
  bundleIdPrefix: com.twarge
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    visionOS: "1.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  # XcodeGen 2.46 files Sangam/AppIcon.icon under "wrapper.icon", a type Xcode
  # doesn't define; Xcode's own name for an Icon Composer bundle is
  # folder.iconcomposer.icon. The spec has no key for a file reference's type,
  # so it is corrected once the project is written.
  postGenCommand: >-
    sed -i '' 's/lastKnownFileType = wrapper\.icon;/lastKnownFileType = folder.iconcomposer.icon;/'
    Sangam.xcodeproj/project.pbxproj

settings:
  base:
    # Apple Silicon only, everywhere — including the Mac and the simulator.
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 257KW9ZJFP
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: 0.1.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6 is the newest language MODE (modes are 4/4.2/5/6); the
    # toolchain itself is whatever Xcode provides. Higher values here read
    # as future modes and break older toolchains like CI's.
    SWIFT_VERSION: "6"

packages:
  JitsiNativeCore:
    path: ../packages/JitsiNativeCore

targets:
  Sangam:
    type: application
    supportedDestinations: [macOS, iOS, visionOS]
    productName: Sangam
    sources:
      # visionOS gets the shell only — the join form, recents, credentials,
      # links and intents. Jitsi's WebRTC binary has no visionOS slice, so
      # everything that touches the conference or its media stays on iOS and
      # macOS. Once a visionOS WebRTC exists, drop the filters here and on the
      # package products below, and the `os(visionOS)` conditions in the shell.
      - path: Sangam/Sources
        excludes: &meetingSources
          - AppleMeetingTranscriber.swift
          - CallSessionManager.swift
          - CaptionOverlay.swift
          - ConversationSession.swift
          - ConversationSidebar.swift
          - ConversationSummarizer.swift
          - FeedWindow.swift
          - MacScreenShareController.swift
          - MeetingActivityController.swift
          - MeetingControlBar.swift
          - MeetingController.swift
          - MeetingView.swift
          - MenuBarControls.swift
          - NativeMeetingSurface.swift
          - PictureInPicture.swift
          - PollsPanel.swift
          - ReplayKitFrameReceiver.swift
          - SpacebarMicrophone.swift
          - SpeakerStatsPanel.swift
          - StageWindow.swift
          - TranscriptSheet.swift
      - path: Sangam/Sources
        includes: *meetingSources
        destinationFilters: [iOS, macOS]
      - path: SangamShared
      - path: Sangam/AppIcon.icon
    dependencies:
      - package: JitsiNativeCore
        product: JitsiNativeCore
      - package: JitsiNativeCore
        product: JitsiMedia
        destinationFilters: [iOS, macOS]
      - package: JitsiNativeCore
        product: JitsiConference
        destinationFilters: [iOS, macOS]
      - package: JitsiNativeCore
        product: JitsiMeetingNotes
      - target: SangamBroadcastExtension
        embed: true
        destinationFilters: [iOS]
      - target: SangamWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        # Sangam/AppIcon.icon, written by Scripts/make-app-icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam
        PRODUCT_NAME: Sangam
        TARGETED_DEVICE_FAMILY: "1,2"
        # Native Apple Vision app, not iPad-compatibility mode.
        "TARGETED_DEVICE_FAMILY[sdk=xros*]": "7"
        "TARGETED_DEVICE_FAMILY[sdk=xrsimulator*]": "7"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sangam/SangamMac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Sangam/SangamIOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sangam/SangamIOS.entitlements
        "INFOPLIST_FILE[sdk=macosx*]": Sangam/Info-macOS.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": Sangam/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Sangam/Info-iOS.plist
        "INFOPLIST_FILE[sdk=xros*]": Sangam/Info-visionOS.plist
        "INFOPLIST_FILE[sdk=xrsimulator*]": Sangam/Info-visionOS.plist
        # XcodeGen gives a multi-destination app the iOS runpath only, so a Mac
        # build looks for embedded frameworks beside the executable instead of
        # in Contents/Frameworks and dyld fails to load WebRTC at launch.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    scheme:
      gatherCoverageData: false

  SangamWidgets:
    type: app-extension
    platform: iOS
    productName: SangamWidgets
    sources:
      - path: SangamWidgets
      - path: SangamShared
    settings:
      base:
        INFOPLIST_FILE: SangamWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam.widgets
        PRODUCT_NAME: SangamWidgets
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    scheme:
      gatherCoverageData: false

  SangamBroadcastExtension:
    type: app-extension
    platform: iOS
    productName: SangamBroadcastExtension
    sources:
      - path: SangamBroadcastExtension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SangamBroadcastExtension/SangamBroadcastExtension.entitlements
        INFOPLIST_FILE: SangamBroadcastExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.sangam.broadcast
        PRODUCT_NAME: SangamBroadcastExtension
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
